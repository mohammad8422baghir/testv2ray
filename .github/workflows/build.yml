name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Fetch native sources (pinned like upstream)
      run: |
        rm -rf AndroidLibXrayLite hev-socks5-tunnel
        git clone https://github.com/2dust/AndroidLibXrayLite.git
        git -C AndroidLibXrayLite checkout ea96a7f9c33d6e18021386db96bf95680e853c93
        git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git
        git -C hev-socks5-tunnel checkout d9dca26c7ad0e494492244f0309e80ee583e739e
        git -C hev-socks5-tunnel submodule update --init --recursive
        CURRENT_TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        echo "libv2ray tag: $CURRENT_TAG"

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh
        cp -r libs V2rayNG/app/

    - name: Download libv2ray.aar
      run: |
        mkdir -p V2rayNG/app/libs
        curl -L --fail -o V2rayNG/app/libs/libv2ray.aar \
          "https://github.com/2dust/AndroidLibXrayLite/releases/download/${CURRENT_TAG}/libv2ray.aar"
        ls -la V2rayNG/app/libs

    - name: Create signing key
      run: |
        keytool -genkeypair -v -keystore $RUNNER_TEMP/my.jks -alias mykey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass 123456 -keypass 123456 -dname "CN=MyVPN"

    - name: Build APK (arm64 only, fast)
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod +x gradlew
        ./gradlew assembleFdroidRelease -PABI_FILTERS="arm64-v8a" \
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/my.jks \
          -Pandroid.injected.signing.store.password=123456 \
          -Pandroid.injected.signing.key.alias=mykey \
          -Pandroid.injected.signing.key.password=123456

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-vpn-apk
        path: V2rayNG/app/build/outputs/apk/**/release/*.apk
